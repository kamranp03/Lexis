<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="860" height="640" fill="#fafafa"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#111" letter-spacing="1">DB PRO — ARCHITECTURE</text>
  <line x1="60" y1="44" x2="800" y2="44" stroke="#ccc" stroke-width="1"/>

  <!-- ═══════════════ FRONTEND ═══════════════ -->
  <rect x="60" y="60" width="740" height="110" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  <text x="80" y="80" font-size="10" font-weight="700" fill="#555" letter-spacing="1.5">FRONTEND</text>
  <text x="80" y="93" font-size="9" fill="#888">React 18 · TypeScript · Vite · Tailwind CSS</text>

  <!-- Frontend inner boxes -->
  <rect x="80" y="100" width="150" height="54" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="155" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Zustand Store</text>
  <text x="155" y="133" text-anchor="middle" font-size="8" fill="#777">Global State</text>
  <text x="155" y="145" text-anchor="middle" font-size="8" fill="#777">connections · query · history</text>

  <rect x="250" y="100" width="150" height="54" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="325" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Axios API Client</text>
  <text x="325" y="133" text-anchor="middle" font-size="8" fill="#777">api/client.ts</text>
  <text x="325" y="145" text-anchor="middle" font-size="8" fill="#777">typed wrappers for all endpoints</text>

  <rect x="420" y="100" width="170" height="54" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="505" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#333">UI Components</text>
  <text x="505" y="133" text-anchor="middle" font-size="8" fill="#777">QueryEditor · NLPInput · Sidebar</text>
  <text x="505" y="145" text-anchor="middle" font-size="8" fill="#777">ResultsPanel · SchemaExplorer</text>

  <rect x="606" y="100" width="174" height="54" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="693" y="120" text-anchor="middle" font-size="9" font-weight="700" fill="#333">App.tsx</text>
  <text x="693" y="133" text-anchor="middle" font-size="8" fill="#777">Root · handleExecute</text>
  <text x="693" y="145" text-anchor="middle" font-size="8" fill="#777">handleExplain · handleFix</text>

  <!-- Arrow: Frontend → Backend -->
  <line x1="430" y1="170" x2="430" y2="202" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="450" y="190" font-size="8" fill="#888">HTTP /api (Vite proxy)</text>

  <!-- ═══════════════ BACKEND ═══════════════ -->
  <rect x="60" y="204" width="740" height="230" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  <text x="80" y="224" font-size="10" font-weight="700" fill="#555" letter-spacing="1.5">BACKEND</text>
  <text x="80" y="237" font-size="9" fill="#888">FastAPI · Python 3.12 · SQLAlchemy (async) · Pydantic · aiosqlite</text>

  <!-- Routers box -->
  <rect x="80" y="248" width="170" height="170" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="165" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Routers</text>
  <line x1="80" y1="270" x2="250" y2="270" stroke="#e0e0e0" stroke-width="1"/>
  <text x="90" y="287" font-size="8" fill="#555">/api/connections</text>
  <text x="90" y="300" font-size="8" fill="#777">  GET  list all</text>
  <text x="90" y="312" font-size="8" fill="#777">  POST create / test</text>
  <text x="90" y="325" font-size="8" fill="#777">  PUT  update</text>
  <text x="90" y="338" font-size="8" fill="#555">/api/query/execute</text>
  <text x="90" y="351" font-size="8" fill="#777">  POST run SQL/MongoDB</text>
  <text x="90" y="364" font-size="8" fill="#555">/api/schema/{id}/tables</text>
  <text x="90" y="377" font-size="8" fill="#555">/api/history</text>
  <text x="90" y="390" font-size="8" fill="#555">/api/ai/*</text>
  <text x="90" y="403" font-size="8" fill="#777">  nl-to-query · explain</text>

  <!-- Services box -->
  <rect x="268" y="248" width="175" height="170" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="355" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Services</text>
  <line x1="268" y1="270" x2="443" y2="270" stroke="#e0e0e0" stroke-width="1"/>
  <text x="278" y="288" font-size="8.5" font-weight="600" fill="#444">db_manager.py</text>
  <text x="278" y="301" font-size="8" fill="#777">  detect_available_drivers()</text>
  <text x="278" y="313" font-size="8" fill="#777">  build_connection_params()</text>
  <text x="278" y="325" font-size="8" fill="#777">  test_connection()</text>
  <text x="278" y="337" font-size="8" fill="#777">  get_connection()</text>
  <text x="278" y="353" font-size="8.5" font-weight="600" fill="#444">query_executor.py</text>
  <text x="278" y="366" font-size="8" fill="#777">  execute_query()</text>
  <text x="278" y="378" font-size="8" fill="#777">  _execute_sql()</text>
  <text x="278" y="390" font-size="8" fill="#777">  _execute_mongodb()</text>
  <text x="278" y="406" font-size="8.5" font-weight="600" fill="#444">history_service.py</text>

  <!-- AI Agent box -->
  <rect x="461" y="248" width="319" height="170" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="620" y="266" text-anchor="middle" font-size="9" font-weight="700" fill="#333">AI Agent (LangGraph)</text>
  <line x1="461" y1="270" x2="780" y2="270" stroke="#e0e0e0" stroke-width="1"/>

  <!-- LangGraph flow inside -->
  <!-- Router node -->
  <rect x="472" y="278" width="72" height="32" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="508" y="291" text-anchor="middle" font-size="8" font-weight="700" fill="#333">router</text>
  <text x="508" y="303" text-anchor="middle" font-size="7" fill="#888">classify intent</text>

  <!-- Arrow right from router -->
  <line x1="544" y1="294" x2="564" y2="294" stroke="#aaa" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Intent nodes column -->
  <rect x="566" y="276" width="80" height="20" rx="2" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="606" y="290" text-anchor="middle" font-size="8" fill="#444">query_gen</text>

  <rect x="566" y="300" width="80" height="20" rx="2" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="606" y="314" text-anchor="middle" font-size="8" fill="#444">explain</text>

  <rect x="566" y="324" width="80" height="20" rx="2" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="606" y="338" text-anchor="middle" font-size="8" fill="#444">optimize</text>

  <rect x="566" y="348" width="80" height="20" rx="2" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="606" y="362" text-anchor="middle" font-size="8" fill="#444">fix</text>

  <rect x="566" y="372" width="80" height="20" rx="2" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="606" y="386" text-anchor="middle" font-size="8" fill="#444">explore</text>

  <!-- Conditional lines from router to nodes -->
  <line x1="544" y1="286" x2="560" y2="286" stroke="#bbb" stroke-width="0.8"/>
  <line x1="560" y1="286" x2="560" y2="405" stroke="#bbb" stroke-width="0.8"/>
  <line x1="560" y1="310" x2="566" y2="310" stroke="#bbb" stroke-width="0.8" marker-end="url(#arr-sm)"/>
  <line x1="560" y1="334" x2="566" y2="334" stroke="#bbb" stroke-width="0.8" marker-end="url(#arr-sm)"/>
  <line x1="560" y1="358" x2="566" y2="358" stroke="#bbb" stroke-width="0.8" marker-end="url(#arr-sm)"/>
  <line x1="560" y1="382" x2="566" y2="382" stroke="#bbb" stroke-width="0.8" marker-end="url(#arr-sm)"/>
  <line x1="560" y1="286" x2="566" y2="286" stroke="#bbb" stroke-width="0.8" marker-end="url(#arr-sm)"/>

  <!-- Groq LLM box -->
  <rect x="660" y="278" width="112" height="114" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="716" y="295" text-anchor="middle" font-size="8" font-weight="700" fill="#333">Groq LLM</text>
  <line x1="660" y1="299" x2="772" y2="299" stroke="#e0e0e0" stroke-width="1"/>
  <text x="716" y="313" text-anchor="middle" font-size="7.5" fill="#555">nodes.py</text>
  <text x="716" y="325" text-anchor="middle" font-size="7" fill="#777">get_llm()</text>
  <text x="716" y="337" text-anchor="middle" font-size="7.5" fill="#555">prompts.py</text>
  <text x="716" y="349" text-anchor="middle" font-size="7" fill="#777">ROUTER_PROMPT</text>
  <text x="716" y="360" text-anchor="middle" font-size="7" fill="#777">QUERY_GEN_PROMPT</text>
  <text x="716" y="371" text-anchor="middle" font-size="7" fill="#777">FIX / EXPLAIN etc.</text>
  <text x="716" y="384" text-anchor="middle" font-size="7.5" fill="#555">tools.py</text>
  <text x="716" y="395" text-anchor="middle" font-size="7" fill="#777">get_schema_context()</text>

  <!-- arrows from intent nodes to LLM -->
  <line x1="646" y1="294" x2="660" y2="294" stroke="#bbb" stroke-width="0.8" marker-end="url(#arr-sm)"/>

  <!-- ═══════════════ DATABASES LAYER ═══════════════ -->

  <!-- Arrow: Backend → Internal DB -->
  <line x1="200" y1="434" x2="200" y2="468" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Arrow: Backend → External DBs -->
  <line x1="580" y1="434" x2="580" y2="468" stroke="#888" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Internal SQLite -->
  <rect x="60" y="470" width="300" height="110" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  <text x="80" y="490" font-size="10" font-weight="700" fill="#555" letter-spacing="1.5">INTERNAL DB</text>
  <text x="80" y="503" font-size="9" fill="#888">SQLite · aiosqlite · SQLAlchemy ORM</text>
  <rect x="80" y="512" width="125" height="52" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="142" y="529" text-anchor="middle" font-size="8.5" font-weight="700" fill="#333">connections</text>
  <text x="142" y="542" text-anchor="middle" font-size="7.5" fill="#777">id · name · db_type</text>
  <text x="142" y="554" text-anchor="middle" font-size="7.5" fill="#777">config (JSON) · last_used</text>
  <rect x="222" y="512" width="118" height="52" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="281" y="529" text-anchor="middle" font-size="8.5" font-weight="700" fill="#333">query_history</text>
  <text x="281" y="542" text-anchor="middle" font-size="7.5" fill="#777">query_text · status</text>
  <text x="281" y="554" text-anchor="middle" font-size="7.5" fill="#777">execution_ms · is_favorite</text>

  <!-- External DBs -->
  <rect x="380" y="470" width="420" height="110" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  <text x="400" y="490" font-size="10" font-weight="700" fill="#555" letter-spacing="1.5">EXTERNAL DATABASES</text>
  <text x="400" y="503" font-size="9" fill="#888">connected at query time — no persistent pool</text>

  <rect x="398" y="512" width="90" height="52" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="443" y="532" text-anchor="middle" font-size="9" font-weight="700" fill="#333">PostgreSQL</text>
  <text x="443" y="545" text-anchor="middle" font-size="7.5" fill="#777">psycopg2</text>
  <text x="443" y="557" text-anchor="middle" font-size="7.5" fill="#777">port 5432</text>

  <rect x="498" y="512" width="90" height="52" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="543" y="532" text-anchor="middle" font-size="9" font-weight="700" fill="#333">MySQL</text>
  <text x="543" y="545" text-anchor="middle" font-size="7.5" fill="#777">pymysql</text>
  <text x="543" y="557" text-anchor="middle" font-size="7.5" fill="#777">port 3306</text>

  <rect x="598" y="512" width="90" height="52" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="643" y="532" text-anchor="middle" font-size="9" font-weight="700" fill="#333">MongoDB</text>
  <text x="643" y="545" text-anchor="middle" font-size="7.5" fill="#777">pymongo</text>
  <text x="643" y="557" text-anchor="middle" font-size="7.5" fill="#777">port 27017</text>

  <rect x="698" y="512" width="90" height="52" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="743" y="532" text-anchor="middle" font-size="9" font-weight="700" fill="#333">Oracle</text>
  <text x="743" y="545" text-anchor="middle" font-size="7.5" fill="#777">oracledb</text>
  <text x="743" y="557" text-anchor="middle" font-size="7.5" fill="#777">port 1521</text>

  <!-- Footer -->
  <line x1="60" y1="596" x2="800" y2="596" stroke="#ddd" stroke-width="1"/>
  <text x="430" y="614" text-anchor="middle" font-size="8" fill="#aaa">dbpro.db (SQLite) stores app metadata · User DBs are external targets · AI uses Groq API (cloud)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="arr-sm" markerWidth="5" markerHeight="5" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L5,2 z" fill="#bbb"/>
    </marker>
  </defs>

</svg>
